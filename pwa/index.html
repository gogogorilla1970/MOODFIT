<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6e365d"><link rel="manifest" href="manifest.webmanifest"><title>MOODFIT</title><style>body{margin:0;background:#fff7fa;color:#2e2430;font:16px system-ui}.wrap{max-width:760px;margin:auto;padding:24px}h1{color:#6e365d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;padding:16px;border-radius:22px;box-shadow:0 5px 24px #6e365d18}input[type=file],textarea{width:100%;box-sizing:border-box;margin:8px 0 14px}label{display:flex;justify-content:space-between;padding:7px 0}button{width:100%;padding:16px;margin:6px 0;border:0;border-radius:16px;font-weight:700;background:#6e365d;color:white}.alt{background:white;color:#6e365d;border:1px solid #6e365d}small{color:#745f70}@media(max-width:520px){.wrap{padding:16px}}</style></head><body><main class="wrap"><h1>MOODFIT</h1><p>Makeover Composer · v0.3</p><div class="grid"><div class="card"><b>YOU</b><input id="you" type="file" accept="image/*"></div><div class="card"><b>LOOK</b><input id="look" type="file" accept="image/*"></div></div><div class="card" style="margin-top:14px"><b>Aus LOOK übernehmen</b><label>Outfit<input id="outfit" type="checkbox" checked></label><label>Frisur<input id="hair" type="checkbox" checked></label><label>Make-up<input id="makeup" type="checkbox" checked></label><label>Pose<input id="pose" type="checkbox" checked></label><label>Hintergrund<input id="bg" type="checkbox"></label><textarea id="extra" rows="3" placeholder="Optionaler Zusatzwunsch"></textarea><button onclick="go('chatgpt')">Für ChatGPT vorbereiten</button><button class="alt" onclick="go('gemini')">Für Gemini / Nano Banana vorbereiten</button><button class="alt" onclick="copyP()">Prompt kopieren</button><small>Die PWA kopiert den optimierten Prompt. Die zwei ausgewählten Bilder fügst du anschließend in ChatGPT oder Gemini hinzu.</small></div></main><script src="app.js"></script></body></html>
